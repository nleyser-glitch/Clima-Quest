<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clima-Quest ALINEA</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; color: #333; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 90vh; }
        .card { background: white; width: 100%; max-width: 500px; padding: 25px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); text-align: center; }
        h1 { color: #1d4ed8; margin-bottom: 10px; }
        p { color: #666; margin-bottom: 20px; font-size: 14px; }
        .btn { background-color: #1d4ed8; color: white; border: none; padding: 12px 20px; border-radius: 6px; font-size: 15px; font-weight: bold; cursor: pointer; width: 100%; margin-bottom: 10px; }
        .btn-secondary { background-color: #64748b; }
        .hidden { display: none; }
        input[type="password"], select { width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        .scale { display: flex; justify-content: space-between; margin: 20px 0; gap: 5px; }
        .scale button { flex: 1; padding: 10px; border: 1px solid #1d4ed8; background: white; color: #1d4ed8; font-weight: bold; border-radius: 5px; cursor: pointer; }
        .scale button.selected { background: #1d4ed8; color: white; }
    </style>
</head>
<body>

<div class="card">
    <!-- PANTALLA INICIAL -->
    <div id="v-home">
        <h1>Clima-Quest</h1>
        <p>Evaluación de Clima Laboral - ALINEA</p>
        <button class="btn" onclick="show('v-collab')">Soy Colaborador (Test)</button>
        <button class="btn btn-secondary" onclick="show('v-admin')">Panel Administrador</button>
    </div>

    <!-- PANTALLA ADMIN -->
    <div id="v-admin" class="hidden">
        <h2>Acceso Administrativo</h2>
        <input type="password" id="pass" placeholder="Ingresa contraseña">
        <button class="btn" onclick="login()">Ingresar</button>
        <button class="btn btn-secondary" onclick="show('v-home')">Volver</button>
    </div>

    <!-- DASHBOARD -->
    <div id="v-dash" class="hidden">
        <h2>Dashboard</h2>
        <p>Total de Respuestas Guardadas:</p>
        <h1 id="count" style="font-size: 50px; color: #1d4ed8;">0</h1>
        <button class="btn" onclick="clearData()">Reiniciar Contador a 0</button>
        <button class="btn btn-secondary" onclick="show('v-home')">Cerrar Sesión</button>
    </div>

    <!-- DATOS COLABORADOR -->
    <div id="v-collab" class="hidden">
        <h2>Registro</h2>
        <select id="area">
            <option value="">-- Selecciona tu Área --</option>
            <option value="Operaciones">Operaciones</option>
            <option value="Comercial">Comercial</option>
            <option value="Administración">Administración</option>
        </select>
        <button class="btn" onclick="startSurvey()">Comenzar</button>
        <button class="btn btn-secondary" onclick="show('v-home')">Cancelar</button>
    </div>

    <!-- TEST -->
    <div id="v-test" class="hidden">
        <h3 id="q-num">Pregunta 1 de 5</h3>
        <p id="q-txt">Siento que mi opinión es valorada.</p>
        <div class="scale">
            <button onclick="setScore(1)">1</button>
            <button onclick="setScore(2)">2</button>
            <button onclick="setScore(3)">3</button>
            <button onclick="setScore(4)">4</button>
            <button onclick="setScore(5)">5</button>
        </div>
        <button class="btn" id="btn-next" onclick="nextQ()" disabled>Siguiente</button>
    </div>

    <!-- GRACIAS -->
    <div id="v-thanks" class="hidden">
        <h2 style="color: #10b981;">¡Muchas Gracias!</h2>
        <p>Tus respuestas han sido registradas de forma totalmente anónima.</p>
        <button class="btn" onclick="show('v-home')">Finalizar</button>
    </div>
</div>

<script>
    const questions = [
        "Siento que mi opinión es valorada en mi equipo.",
        "Cuento con las herramientas necesarias para trabajar.",
        "Existe un ambiente de respeto en mi área.",
        "Recibo retroalimentación oportuna sobre mi trabajo.",
        "Recomendaría esta organización para trabajar."
    ];
    let qIdx = 0;
    let score = null;

    function show(id) {
        document.querySelectorAll('.card > div').forEach(div => div.classList.add('hidden'));
        document.getElementById(id).classList.remove('hidden');
    }

    function login() {
        if (document.getElementById('pass').value === 'alinea2026') {
            document.getElementById('count').innerText = localStorage.getItem('cq_clean_v5') || '0';
            document.getElementById('pass').value = '';
            show('v-dash');
        } else {
            alert('Contraseña incorrecta');
        }
    }

    function clearData() {
        localStorage.setItem('cq_clean_v5', '0');
        document.getElementById('count').innerText = '0';
        alert('Métricas reiniciadas a 0');
    }

    function startSurvey() {
        if (!document.getElementById('area').value) {
            alert('Por favor selecciona un área');
            return;
        }
        qIdx = 0;
        loadQ();
        show('v-test');
    }

    function loadQ() {
        score = null;
        document.querySelectorAll('.scale button').forEach(btn => btn.classList.remove('selected'));
        document.getElementById('btn-next').disabled = true;
        document.getElementById('q-num').innerText = 'Pregunta ' + (qIdx + 1) + ' de ' + questions.length;
        document.getElementById('q-txt').innerText = questions[qIdx];
    }

    function setScore(val) {
        score = val;
        document.querySelectorAll('.scale button').forEach((btn, idx) => {
            btn.classList.toggle('selected', idx + 1 === val);
        });
        document.getElementById('btn-next').disabled = false;
    }

    function nextQ() {
        if (score === null) return;
        qIdx++;
        if (qIdx < questions.length) {
            loadQ();
        } else {
            let current = parseInt(localStorage.getItem('cq_clean_v5') || '0');
            localStorage.setItem('cq_clean_v5', (current + 1).toString());
            show('v-thanks');
        }
    }
</script>
</body>
</html>
