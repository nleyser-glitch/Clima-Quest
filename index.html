<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clima-Quest | ALINEA</title>
    <style>
        :root {
            --bg-main: #F8FAFC;
            --bg-card: #FFFFFF;
            --text-primary: #0F172A;
            --text-secondary: #475569;
            --accent: #2563EB;
            --accent-hover: #1D4ED8;
            --border: #E2E8F0;
            --success: #10B981;
            --radius: 12px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-primary); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .card { background: var(--bg-card); width: 100%; max-width: 650px; padding: 32px; border-radius: var(--radius); border: 1px solid var(--border); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
        .header { text-align: center; margin-bottom: 24px; }
        .badge { background: #EFF6FF; color: var(--accent); font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 20px; display: inline-block; margin-bottom: 8px; }
        h1 { font-size: 26px; font-weight: 800; color: var(--text-primary); }
        h2 { font-size: 20px; margin-bottom: 12px; color: var(--text-primary); }
        p { color: var(--text-secondary); font-size: 14px; margin-bottom: 20px; }

        .btn { background-color: var(--accent); color: white; border: none; padding: 12px 20px; border-radius: 8px; font-weight: 600; font-size: 14px; cursor: pointer; width: 100%; transition: background 0.2s; }
        .btn:hover { background-color: var(--accent-hover); }
        .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text-primary); margin-top: 8px; }
        .btn-outline:hover { background: #F1F5F9; }
        
        .form-group { margin-bottom: 16px; text-align: left; }
        label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
        select, input[type="password"] { width: 100%; padding: 10px 12px; border-radius: 6px; border: 1px solid var(--border); font-size: 14px; outline: none; }
        
        .hidden { display: none !important; }
        
        .scale { display: flex; gap: 8px; margin: 20px 0; }
        .scale-btn { flex: 1; padding: 14px 0; border: 1px solid var(--border); background: white; border-radius: 8px; font-weight: 700; cursor: pointer; color: var(--text-primary); }
        .scale-btn.active { background: var(--accent); color: white; border-color: var(--accent); }

        .metric-box { background: #F8FAFC; border: 1px solid var(--border); padding: 20px; border-radius: 8px; text-align: center; margin-bottom: 20px; }
        .metric-num { font-size: 40px; font-weight: 800; color: var(--accent); }
    </style>
</head>
<body>

<div class="card">
    <!-- PANTALLA INICIAL -->
    <div id="screen-welcome">
        <div class="header">
            <span class="badge">ALINEA CONSULTORÍA</span>
            <h1>Clima-Quest</h1>
            <p>Diagnóstico de Clima Laboral</p>
        </div>
        <button class="btn" onclick="goTo('screen-setup')">Soy Colaborador (Realizar Test)</button>
        <button class="btn btn-outline" onclick="goTo('screen-login')">Panel Administrador</button>
    </div>

    <!-- PANTALLA LOGIN ADMIN -->
    <div id="screen-login" class="hidden">
        <h2>Acceso Administrador</h2>
        <div class="form-group">
            <label>Contraseña</label>
            <input type="password" id="pass-input" placeholder="Ingresa la contraseña">
        </div>
        <button class="btn" onclick="login()">Ingresar</button>
        <button class="btn btn-outline" onclick="goTo('screen-welcome')">Volver</button>
    </div>

    <!-- PANTALLA DASHBOARD ADMIN -->
    <div id="screen-dash" class="hidden">
        <h2>Panel de Diagnóstico</h2>
        <div class="metric-box">
            <div class="metric-num" id="total-val">0</div>
            <p style="margin:0;">Evaluaciones Completadas</p>
        </div>
        <button class="btn btn-outline" onclick="resetMetrics()">Reiniciar Métricas a 0</button>
        <button class="btn btn-outline" onclick="goTo('screen-welcome')">Cerrar Sesión</button>
    </div>

    <!-- PANTALLA REGISTRO COLABORADOR -->
    <div id="screen-setup" class="hidden">
        <h2>Registro de Colaborador</h2>
        <div class="form-group">
            <label>Empresa / Campaña</label>
            <select id="sel-company" onchange="changeAreas()">
                <option value="">-- Selecciona Empresa --</option>
                <option value="XTRIM">XTRIM</option>
                <option value="CLARO">CLARO</option>
                <option value="BANCO DE GUAYAQUIL">BANCO DE GUAYAQUIL</option>
            </select>
        </div>
        <div class="form-group">
            <label>Área / Departamento</label>
            <select id="sel-area">
                <option value="">-- Selecciona Área --</option>
            </select>
        </div>
        <button class="btn" onclick="startTest()">Comenzar Evaluación</button>
        <button class="btn btn-outline" onclick="goTo('screen-welcome')">Cancelar</button>
    </div>

    <!-- PANTALLA PREGUNTAS -->
    <div id="screen-questions" class="hidden">
        <span style="font-size:12px; font-weight:700; color:var(--accent);" id="q-number">Pregunta 1 de 5</span>
        <h3 id="q-title" style="margin: 12px 0 20px 0; font-size:16px;">Texto de la pregunta</h3>
        
        <div class="scale">
            <button class="scale-btn" onclick="pickVal(1)">1</button>
            <button class="scale-btn" onclick="pickVal(2)">2</button>
            <button class="scale-btn" onclick="pickVal(3)">3</button>
            <button class="scale-btn" onclick="pickVal(4)">4</button>
            <button class="scale-btn" onclick="pickVal(5)">5</button>
        </div>

        <button class="btn" id="btn-next" onclick="nextQ()" disabled>Siguiente Pregunta</button>
    </div>

    <!-- PANTALLA GRACIAS -->
    <div id="screen-thanks" class="hidden" style="text-align:center;">
        <h2 style="color:var(--success);">¡Evaluación Completada!</h2>
        <p>Tus respuestas han sido guardadas con éxito.</p>
        <button class="btn" onclick="goTo('screen-welcome')">Volver al Inicio</button>
    </div>
</div>

<script>
    const orgData = {
        "XTRIM": ["Fidelización", "Retención", "Calidad", "Talento Humano", "Operaciones", "Sistemas", "Servicios Generales"],
        "CLARO": ["Renovación", "Hogar", "Migración"],
        "BANCO DE GUAYAQUIL": ["Colocación", "Avisos"]
    };

    const questionsList = [
        "Siento que mi opinión es valorada en mi equipo de trabajo.",
        "Cuento con las herramientas necesarias para realizar mis funciones.",
        "Existe un ambiente de respeto y colaboración en mi área.",
        "Recibo retroalimentación oportuna sobre mi desempeño.",
        "Recomendaría esta organización como un excelente lugar para trabajar."
    ];

    let currentQ = 0;
    let selectedVal = null;

    function goTo(screenId) {
        document.querySelectorAll('.card > div').forEach(div => div.classList.add('hidden'));
        document.getElementById(screenId).classList.remove('hidden');
    }

    function changeAreas() {
        const company = document.getElementById('sel-company').value;
        const areaSelect = document.getElementById('sel-area');
        areaSelect.innerHTML = '<option value="">-- Selecciona Área --</option>';
        if (company && orgData[company]) {
            orgData[company].forEach(a => {
                const opt = document.createElement('option');
                opt.value = a;
                opt.textContent = a;
                areaSelect.appendChild(opt);
            });
        }
    }

    function login() {
        const pass = document.getElementById('pass-input').value;
        if (pass === 'alinea2026') {
            document.getElementById('total-val').innerText = localStorage.getItem('cq_count_ok') || '0';
            document.getElementById('pass-input').value = '';
            goTo('screen-dash');
        } else {
            alert('Contraseña incorrecta');
        }
    }

    function resetMetrics() {
        localStorage.setItem('cq_count_ok', '0');
        document.getElementById('total-val').innerText = '0';
        alert('Contador reiniciado a 0');
    }

    function startTest() {
        const comp = document.getElementById('sel-company').value;
        const area = document.getElementById('sel-area').value;
        if (!comp || !area) {
            alert('Por favor selecciona tu Empresa y tu Área.');
            return;
        }
        currentQ = 0;
        loadQuestion();
        goTo('screen-questions');
    }

    function loadQuestion() {
        selectedVal = null;
        document.querySelectorAll('.scale-btn').forEach(btn => btn.classList.remove('active'));
        document.getElementById('btn-next').disabled = true;
        document.getElementById('q-number').innerText = 'Pregunta ' + (currentQ + 1) + ' de ' + questionsList.length;
        document.getElementById('q-title').innerText = questionsList[currentQ];
    }

    function pickVal(val) {
        selectedVal = val;
        document.querySelectorAll('.scale-btn').forEach((btn, idx) => {
            btn.classList.toggle('active', idx + 1 === val);
        });
        document.getElementById('btn-next').disabled = false;
    }

    function nextQ() {
        if (selectedVal === null) return;
        currentQ++;
        if (currentQ < questionsList.length) {
            loadQuestion();
        } else {
            let current = parseInt(localStorage.getItem('cq_count_ok') || '0');
            localStorage.setItem('cq_count_ok', (current + 1).toString());
            goTo('screen-thanks');
        }
    }
</script>
</body>
</html>
